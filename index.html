## 1. 역할 및 목적

너는 교육공학 및 교수설계 전문가이자 UX/UI 디자이너, 프론트엔드 개발자야.

나는 기존 이러닝 환경을 학습과학 이론에 근거하여 분석하고, 학습 경험을 개선한 웹 프로토타입을 제작하려고 해.

이번 재설계의 목적은 단순히 기존 홈페이지의 디자인을 변경하는 것이 아니라, 학습 환경의 문제점을 진단하고 이를 개선할 수 있는 구체적인 학습 활동과 기능을 설계하는 거야.

다음 원칙에 따라 작업할 것.

- 기존 이러닝 환경의 문제점을 분석한 결과를 바탕으로 재설계를 진행할 것.
- 이론의 핵심 개념을 실제 학습 환경의 설계 원리로 적용할 것.
- 개선 방향과 구현할 기능 사이의 논리적 연결을 유지할 것.
- 학습자가 실제로 사용할 수 있는 직관적인 인터페이스를 설계할 것.

## 2. 설계 근거

다음은 기존 이러닝 환경을 분석한 결과야.

### 2-1. 네 가지 관점 분석

**① 학습자 중심**

- 현재 상태: [학습자 중심 관점에서 발견한 기존 환경의 특징 및 문제점]
- 개선 방향: [학습자의 선행지식, 흥미, 수준, 요구 등을 고려하여 개선할 방향]
- 구현할 기능 및 요소: [개선 방향을 실현하기 위해 필요한 기능, 콘텐츠, 학습 활동 또는 화면 구성]

**② 지식 중심**

- 현재 상태: [지식 중심 관점에서 발견한 기존 환경의 특징 및 문제점]
- 개선 방향: [핵심 개념의 이해, 개념 간 관계 파악, 지식의 적용 등을 지원하기 위한 개선 방향]
- 구현할 기능 및 요소: [개선 방향을 실현하기 위해 필요한 기능, 콘텐츠, 학습 활동 또는 화면 구성]

**③ 평가 중심**

- 현재 상태: [평가 중심 관점에서 발견한 기존 환경의 특징 및 문제점]
- 개선 방향: [학습 과정 점검, 피드백, 자기 평가 및 학습 개선을 지원하기 위한 개선 방향]
- 구현할 기능 및 요소: [개선 방향을 실현하기 위해 필요한 기능, 콘텐츠, 학습 활동 또는 화면 구성]

**④ 공동체 중심**

- 현재 상태: [공동체 중심 관점에서 발견한 기존 환경의 특징 및 문제점]
- 개선 방향: [학습자 간 지식 공유, 상호작용, 협력 및 공동체 형성을 지원하기 위한 개선 방향]
- 구현할 기능 및 요소: [개선 방향을 실현하기 위해 필요한 기능, 콘텐츠, 학습 활동 또는 화면 구성]

### 2-2. 상호작용 분석

**① 학습자-학습자 상호작용**

- 현재 상태: [학습자 간 토론, 협업, 피어리뷰 등 상호작용의 특징 및 문제점]
- 개선 방향: [학습자 간 상호작용을 개선하기 위한 방향]
- 구현할 기능 및 요소: [토론, 공동 과제, 동료 피드백 등 관련 기능]

**② 학습자-교수자 상호작용**

- 현재 상태: [질의응답, 교수자 피드백, 학습 지원 등의 특징 및 문제점]
- 개선 방향: [학습자와 교수자 간 상호작용을 개선하기 위한 방향]
- 구현할 기능 및 요소: [질문 게시판, 피드백 제공, 학습 지원 등 관련 기능]

**③ 학습자-콘텐츠 상호작용**

- 현재 상태: [학습자가 콘텐츠를 이용하는 방식과 능동적인 학습 참여의 특징 및 문제점]
- 개선 방향: [학습자의 탐색, 적용, 문제 해결 등 능동적인 학습을 지원하기 위한 방향]
- 구현할 기능 및 요소: [퀴즈, 문제 해결 활동, 시뮬레이션, 콘텐츠 조작 등 관련 기능]

**④ 교수자-교수자 상호작용**

- 현재 상태: [교수자, 조교 및 운영진 간 협력과 정보 공유에 관해 확인한 사항]
- 개선 방향: [교수자 및 운영진 간 협력과 일관된 학습 지원을 개선하기 위한 방향]
- 구현할 기능 및 요소: [역할별 관리 기능, 정보 공유 구조 등 관련 요소]

**⑤ 교수자-콘텐츠 상호작용**

- 현재 상태: [교수자의 콘텐츠 설계, 선정, 수정 및 관리에 관해 확인한 사항]
- 개선 방향: [학습자의 요구와 학습 결과를 반영하여 콘텐츠를 개선하기 위한 방향]
- 구현할 기능 및 요소: [콘텐츠 수정 및 보완, 자료 관리 등 관련 요소]

**⑥ 콘텐츠-콘텐츠 상호작용**

- 현재 상태: [차시, 학습 자료 및 콘텐츠 간 연계성과 일관성에 관한 특징 및 문제점]
- 개선 방향: [학습 자료 간 연결과 학습 내용의 연속성을 개선하기 위한 방향]
- 구현할 기능 및 요소: [관련 자료 연결, 학습 순서 구성, 콘텐츠 간 연계 표시 등 관련 요소]

위 분석 결과를 프로토타입의 설계 근거로 활용할 것.

단, 모든 항목에 새로운 기능을 추가할 필요는 없음. 개선이 필요한 항목을 선별하고, 제시된 개선 방향을 실현하는 데 필요한 기능과 요소를 중심으로 구현할 것.

## 3. 구현 요구사항

앞서 제시한 분석 결과를 바탕으로 이러닝 환경의 웹 프로토타입을 제작할 것.

### 3-1. 설계 원칙

- 학습과학 이론의 핵심 개념을 실제 화면과 학습 활동에 반영할 것.
- 각 기능이 어떤 문제를 해결하고 어떤 학습 경험을 지원하는지 고려할 것.
- 기존 환경의 문제점과 개선 방향을 연결하여 기능을 설계할 것.
- 기능의 수를 늘리는 것보다 교육적 목적에 적합한 기능을 구현하는 데 집중할 것.
- 학습자의 학습 흐름과 사용성을 고려하여 화면을 구성할 것.

### 3-2. 기능 구현

- 위에서 제시한 '구현할 기능 및 요소'를 우선적으로 반영할 것.
- 학습자가 직접 조작하고 결과를 확인할 수 있는 기능을 구현할 것.
- 입력, 제출, 수정, 이동 등 주요 상호작용이 실제로 작동하도록 할 것.
- 기능의 목적과 사용 방법을 학습자가 쉽게 이해할 수 있도록 구성할 것.
- 학습 활동에 필요한 콘텐츠와 예시 데이터를 적절히 제공할 것.

### 3-3. 디자인

- 직관적이고 일관된 인터페이스를 구성할 것.
- 학습 콘텐츠와 학습 활동을 명확하게 구분할 것.
- 학습자의 현재 위치와 진행 상황을 쉽게 파악할 수 있도록 할 것.
- 불필요한 메뉴와 장식은 최소화할 것.
- 데스크톱과 모바일 환경에서 사용할 수 있도록 반응형으로 구성할 것.

## 4. 기술 및 구현 조건

else if(page===1)ana(P,"p",`‘${esc(S.env)}’을 선택하셨네요!`,"우리가 선택한 환경을 네 가지 관점으로 분석해보고, 문제를 진단해보세요.",["현재 강좌에서 가장 잘 구현되고 있는 관점은 무엇인가요?","보완할 수 있는 관점은 무엇인가요?"],[["q1",1],["q2",2]]);
else if(page===2)ana(I,"i","잘하고 있어요!","이번에는 우리가 선택한 환경을 6가지 상호작용 유형으로 분석해보고, 개선 방향을 제안해보세요.",["현재 강좌에서 가장 잘 활용되고 있는 상호작용은 무엇인가요?","어떤 상호작용을 강화하면 학습 경험이 개선될까요?"],[["q3",3],["q4",4]]);
else if(page===3){app.innerHTML=`${head()}<p class="greet">훌륭해요!</p><p class="lead">선택한 학습 환경의 문제를 발견하고, 개선 방향성을 잘 찾았어요!<br>우리가 정리한 내용을 한눈에 확인해볼까요?<br><b style="color:var(--fg)">${esc(S.team)} · ${esc(S.env)}</b></p>
<button class="btn" id="dl" style="margin-bottom:32px">이미지 다운로드 ↓</button>
<div class="keys">${QK.map(q=>`<div><small>${q[1]}</small><p>${esc(gv(q[0]).text)}</p></div>`).join("")}</div>
<h2 class="t">네 가지 관점</h2>${summ(P,"p")}<h2 class="t">6가지 상호작용</h2>${summ(I,"i")}${nav()}`;$("#dl").onclick=e=>dlImg(e.target)}
else if(page===4){app.innerHTML=`${head()}<p class="greet">우리가 제안한 재설계 방안을 중심으로<br>실제 학습 환경을 직접 개선해볼까요?</p><p class="lead">Claude.AI를 활용한 학습환경 재설계 프로토타입 만들기</p>
<ol class="steps">
<li><div class="tx">클로드에 접속합니다.<small>다른 AI도 가능해요!</small></div></li>
<li><div class="tx">프롬프트를 입력합니다.<small>활동 정리 페이지에서 다운로드 받은 활동지와 기존 학습환경의 캡처 이미지를 함께 첨부해보세요.</small><div><button class="btn" id="pb">프롬프트 예시</button></div><div class="pbox" id="pbox"><pre>${esc(PROMPT_EXAMPLE)}</pre><button class="btn cp" id="cp">프롬프트 복사하기</button></div></div></li>
<li><div class="tx">홈페이지를 함께 보며 팀원 간 수정사항을 정리합니다.<small>프롬프트를 수정해서 프로토타입을 완성해보세요!</small></div></li>
<li><div class="tx">html 파일로 다운받습니다.</div></li>
<li><div class="tx">구글 드라이브에 업로드합니다.<div><a class="btn" href="${DRIVE}" target="_blank" rel="noopener noreferrer">바로가기 ↗</a></div></div></li></ol>${nav()}`;
$("#pb").onclick=()=>$("#pbox").classList.toggle("on");$("#cp").onclick=e=>copyText(PROMPT_EXAMPLE,e.target)}
else{app.innerHTML=`${head()}<p class="greet">우리가 재설계한 결과물을 다른 팀에게 소개해볼까요?</p><p class="lead">다른 팀의 소개를 들으며 피드백을 남겨보세요.</p>
<div class="zones">${ZN.map((z,i)=>`<section class="zone"><div class="sh"><h3>${z}</h3><button class="btn sm" data-cm="${i}">+ 추가</button></div><div class="cm" id="cm${i}"><textarea id="ct${i}" placeholder="이 팀의 결과물에 대한 의견을 남겨주세요"></textarea><div class="ca"><button class="btn sm" data-pub="${i}">게시</button><button class="btn line sm" data-cx="${i}">취소</button></div></div><div id="po${i}"></div></section>`).join("")}</div>${nav(1)}`;paintPosts()}
document.querySelectorAll("textarea").forEach(grow);if(page<5)document.querySelector("#pv")&&($("#pv").onclick=()=>go(page-1));if(page>0&&page<5&&$("#nx"))$("#nx").onclick=()=>go(page+1);if(page===5)$("#pv").onclick=()=>go(4)}
app.addEventListener("input",e=>{const t=e.target;if(t.tagName==="TEXTAREA"&&t.dataset.id){put(t.dataset.id,t.dataset.f,t.value,{kind:t.dataset.kind,sec:t.dataset.sec,ord:+t.dataset.ord||0});chk&&chk()}if(t.tagName==="TEXTAREA")grow(t)});
app.addEventListener("click",e=>{const b=e.target.closest("[data-add],[data-del],[data-cm],[data-cx],[data-pub],[data-fd]");if(!b)return;const d=b.dataset;
if(d.add){const[k,s]=d.add.split("|");addEntry(k,s)}else if(d.del)delEntry(d.del);
else if(d.cm!==undefined)$("#cm"+d.cm).classList.toggle("on");else if(d.cx!==undefined)$("#cm"+d.cx).classList.remove("on");
else if(d.pub!==undefined){const t=$("#ct"+d.pub),v=t.value.trim();if(!v)return;const p={zone:ZN[d.pub],text:v,team:S.team||"익명",ord:Date.now(),author:uid||""};
if(db)db.from("feedback").insert(p).select().single().then(r=>{if(r.data&&!FB.some(x=>x.id===r.data.id)){FB.push(r.data);paintPosts()}});else{FB.push({id:"l"+p.ord,...p});paintPosts()}t.value="";$("#cm"+d.pub).classList.remove("on")}
else if(d.fd){if(db)db.from("feedback").delete().eq("id",d.fd).then(()=>{FB=FB.filter(p=>p.id!==d.fd);paintPosts()});else{FB=FB.filter(p=>p.id!==d.fd);paintPosts()}}});
render();
try{uid=localStorage.getItem("elclient");if(!uid){uid="c"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("elclient",uid)}}catch(e){uid=uid||"c"+Math.random().toString(36).slice(2)}
(()=>{try{if(SUPABASE_URL.includes("YOUR-")||!window.supabase)return;db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
db.from("feedback").select("*").then(r=>{if(r.data){FB=r.data;if(page===5)paintPosts()}});
db.channel("fb").on("postgres_changes",{event:"*",schema:"public",table:"feedback"},p=>{if(p.eventType==="DELETE")FB=FB.filter(x=>x.id!==p.old.id);else if(!FB.some(x=>x.id===p.new.id))FB.push(p.new);if(page===5)paintPosts()}).subscribe();
if(S.team.trim()){tk=null;joinTeam(S.team)}tabs()}catch(e){}})();
</script></body></html>
